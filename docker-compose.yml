services:
  db:
    image: postgres:16
    container_name: resumeforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resumeforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resumeforge}
      POSTGRES_DB: ${POSTGRES_DB:-resumeforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional in development: only needed with JOB_QUEUE=rq or RATE_LIMIT_STORAGE_URI=redis://.
  redis:
    image: redis:7-alpine
    container_name: resumeforge-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    profiles: ["redis"]

volumes:
  pgdata:
