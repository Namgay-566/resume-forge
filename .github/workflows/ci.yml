name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resumeforge
          POSTGRES_PASSWORD: resumeforge
          POSTGRES_DB: resumeforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resumeforge" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # The test suite creates and resets its own resumeforge_test database.
      DATABASE_URL: postgresql+asyncpg://resumeforge:resumeforge@localhost:5432/resumeforge
      JWT_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: System libraries for PDF export (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-liberation
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - run: pytest -q

  frontend:
    name: Frontend (oxlint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build  # tsc -b (strict) + vite build
        env:
          VITE_API_URL: /api

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          build-args: VITE_API_URL=/api
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
